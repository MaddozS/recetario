name: CI

on:
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.base_ref == 'master' && 'production' || 'staging' }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - type-check
          - test
          - build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @recetario/db generate

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}